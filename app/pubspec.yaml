name: whisker_tales
description: "Whisker Tales — mobile roguelite, แมวโมจิผจญภัยในโลกนิทานสีไม้"
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.18.0
  flutter_riverpod: ^2.5.1
  hive_flutter: ^1.1.0
  wt_core:
    path: ../packages/wt_core
  wt_mode_story:
    path: ../packages/wt_mode_story
  in_app_purchase: ^3.3.1
  games_services: ^4.1.1
  intl: any
  google_mobile_ads: ^9.2.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Game data, copied from design/ by tools/sync_content.sh (T-003)
  assets:
    - assets/content/design/balance/
    - assets/content/design/data/
    - assets/content/design/art/
    # Sprites, copied from assets/raw by tools/sync_sprites.py (T-027)
    - assets/game/cat/
    - assets/game/gear/
    - assets/game/mon/
    - assets/game/bg/
    - assets/game/ui/
    - assets/game/icon/
    - assets/game/home/
    - assets/game/pet/
    # Music + effects, made by tools/audio/make_sounds.py (T-024)
    - assets/audio/
  generate: true # T-004: lib/l10n/*.arb → AppLocalizations
