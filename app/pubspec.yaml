name: whisker_tales
description: "Whisker Tales — mobile roguelite, แมวโมจิผจญภัยในโลกนิทานสีไม้"
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # flutter_localizations — added by T-004 alongside l10n.yaml + .arb files
  flutter_riverpod: ^2.5.1
  hive_flutter: ^1.1.0
  wt_core:
    path: ../packages/wt_core
  wt_mode_story:
    path: ../packages/wt_mode_story

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Game data, copied from design/ by tools/sync_content.sh (T-003)
  assets:
    - assets/content/design/balance/
    - assets/content/design/data/
  # generate: true — enabled by T-004 once l10n.yaml + .arb files exist
