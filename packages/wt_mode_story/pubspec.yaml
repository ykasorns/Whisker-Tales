name: wt_mode_story
description: >
  Whisker Tales — Story mode (biome + boss), the MVP game mode. Implements
  GameMode from wt_core (MODE_PLUGIN_SPEC.md §3). Group B (D-042); ships
  dormant (manifest enabled:false) until YK decides it is part of v1.0.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  wt_core:
    path: ../wt_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/manifest.json
